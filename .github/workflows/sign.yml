name: Sign release manifest

# On every push to main that touches code, regenerate the source manifest (verify.json) and sign it
# with the release key (the GitHub Actions secret HIVE_SIGNING_KEY), then commit both back. This keeps
# the signed manifest exactly in step with the code on main, so a fresh `git clone` always passes
# `hv verify`. Releasing is then just normal pushes — no manual signing step.
#
# One-time setup: run scripts/common/gen_keypair.py locally, commit hivemind.pub, publish it to the website,
# and store the printed private key with:
#   gh secret set HIVE_SIGNING_KEY --repo projectmentor/hive-mind --body '<base64 seed>'

on:
  workflow_dispatch:   # manual re-sign — e.g. after a history rewrite whose top commit touched only
                       # excluded paths (verify.json/*.json), which would otherwise skip the push trigger
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.sh'
      - '**/*.md'
      - '**/*.mjs'
      - '**/*.yml'
      - '**/*.yaml'
      - 'hv'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.svg'
      - '!verify.json'
      - '!verify.json.sig'

# Two jobs (hive-mind-private #56). `test` runs the whole suite, which is repo code a PR author can change,
# so it holds NO secrets: none are referenced in it (tests/test_workflow_secrets.py enforces that for every
# job that runs pytest). `sign` needs `test`, runs in the `signing` Environment (deployable from `main` only),
# and runs nothing from the repo except gen_verify.py, sign_release.py (its own suite gate is skipped,
# because `test` just passed on the same commit) and the `hv verify` self-check.
#
# The default GITHUB_TOKEN only reads. The push to main uses a short-lived token for the
# `hivemind-release-signer` GitHub App (below), the one identity a ruleset on main can list as a bypass (#131).
permissions:
  contents: read

concurrency:
  group: sign-manifest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'        # match ci.yml

      - name: Install test deps
        run: pip install -r requirements.txt pytest pytest-xdist==3.8.0

      # The suite runs against the regenerated manifest, as it did when signing ran in the same job
      # (tests/test_update_script.py relies on a current verify.json). This only writes the working copy.
      - name: Regenerate manifest
        run: python3 scripts/common/gen_verify.py

      - name: Run the full suite
        run: python3 -m pytest -q -n auto

  sign:
    needs: test
    runs-on: ubuntu-latest
    # SIGN_APP_ID and SIGN_APP_KEY resolve from this Environment once they are added to it, and from the
    # repository secrets until then. HIVE_SIGNING_KEY stays a repository secret (its seed cannot be recovered
    # to move it). The Environment deploys from `main` only.
    environment: signing
    permissions:
      contents: read
    steps:
      # #131: push as the hivemind-release-signer GitHub App, not as the default GITHUB_TOKEN. The built-in
      # Actions app cannot be a ruleset bypass actor (GitHub answers 422), so once main requires status
      # checks a default-token push is rejected (GH006) and main stops being re-signed. The App has
      # contents:write on this repository only; each run mints a one-hour installation token from its
      # private key (secrets SIGN_APP_ID, SIGN_APP_KEY), and checkout persists it for the `git push` below.
      - name: Mint a short-lived App token for the push
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.SIGN_APP_ID }}
          private-key: ${{ secrets.SIGN_APP_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0     # full history: gen_verify.py signs `git rev-list --count HEAD` as the manifest `sequence`
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'        # gen_verify.py, sign_release.py and `hv verify` use the standard library only

      - name: Regenerate manifest
        run: python3 scripts/common/gen_verify.py

      - name: Sign and self-check
        env:
          HIVE_SIGNING_KEY: ${{ secrets.HIVE_SIGNING_KEY }}
          HIVE_SIGN_SKIP_TESTS: '1'     # the `test` job above ran the full suite on this commit, with no secrets
        run: |
          if [ -z "$HIVE_SIGNING_KEY" ]; then
            echo "HIVE_SIGNING_KEY not set yet — committing unsigned manifest only."
            exit 0
          fi
          python3 scripts/common/sign_release.py
          if [ -f hivemind.pub ]; then
            HIVE_PUBKEY_URL="file://$PWD/hivemind.pub" ./hv verify | tee /tmp/v.txt
            grep -q '✓ Official' /tmp/v.txt
          else
            echo "hivemind.pub not committed yet — skipping signature self-check."
          fi

      - name: Commit if changed
        run: |
          git config user.name  "hivemind-bot"
          git config user.email "bot@projectmentor.org"
          git add verify.json
          [ -f verify.json.sig ] && git add verify.json.sig
          if git diff --cached --quiet; then
            echo "manifest already current; nothing to commit"
          else
            # [skip ci] matters more now: unlike the default token, an App token's push DOES trigger
            # workflows. The path filter above already keeps this commit from re-running sign.yml.
            git commit -m "chore: re-sign source manifest [skip ci]"
            git push
          fi
