name: CI (macOS)
# The macOS legs of CI, split out of ci.yml to cut PR latency without losing coverage (#125). macOS is the
# only runner that exercises the launchd daemon path, a case-insensitive filesystem and Apple's Python.
#
# - push to main: ALWAYS runs, so every release commit is tested on macOS and a red macOS build shows there.
# - push to release/**: runs after each merge into a release branch. It does not gate the merge; a red run
#   there is fixed forward by an ordinary PR (David, 2026-10-05).
# - pull request into main (the release PR, and fixes straight to main): runs only when the diff touches a path below.
#   A PR into a release/** branch shows no macOS check at all; macOS gates the release PR into main instead. A path filter cannot see which function
#   changed, so any PR that edits `hv` or the daemon still waits for macOS; the saving is docs, skills and
#   tests outside these paths. A docs-only PR shows no macOS check at all.
#
# Do NOT make these jobs required status checks on pull requests: a required check that the filter skipped
# stays pending and blocks the merge. Require the Ubuntu jobs; the merge rule is "CI green, and the macOS
# jobs green when they ran" (CONTRIBUTING.md).
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
    paths:
      - 'hv'
      - 'hivemind/parts/**'                   # hv's body runs from these (3.1); a part-only PR must not skip macOS
      - 'hive_sync_daemon.py'
      - 'requirements.txt'
      - 'scripts/platform/macos/**'
      - 'scripts/installer/_service.sh'
      - 'scripts/installer/_install*.sh'
      - 'scripts/installer/dispatcher.sh'     # macos-installer-smoke checks it resolves through a symlink
      - 'tests/conftest.py'                   # the #109 stubs, launchctl included, front every test
      - 'tests/test_service.py'
      - 'tests/test_daemon_code.py'           # the #121 macOS failure was this file's restart count
      - 'scripts/common/sync_smoke.sh'        # the two-daemon smoke hung #159's macOS run (#161)
      - 'scripts/common/_smoke_daemon.sh'
      - 'tests/test_sync.py'
      - 'tests/integration/**'                # the platform subset below (private docs/design/integration_tests_4x.md §3)
      - 'scripts/common/session_hook.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-macos.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest]          # a one-entry matrix keeps the check name `test (macos-latest)`
    runs-on: ${{ matrix.os }}
    # A green run takes ~12 minutes. Without this a hang runs to GitHub's 6-hour default and ends
    # cancelled, with no output from the test that hung (#159's run, #161).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist==3.8.0 pyflakes==4.0.0
      - name: Run offline test suite
        run: python3 -m pytest -q -n auto   # pytest-xdist: every core (the sign gate runs the same)

  # The integration platform subset (plan §3): only the scenarios whose meaning is platform-specific. S6 is the `timeout`
  # regression, which exists only where coreutils is absent; sync runs on loopback trust because `lo0` aliases need root (an
  # admitted-device residual of the harness; the Linux job covers the Hive-Auth path). S1 (restart exactly-once) joins this
  # list once slice C lands. Add a scenario here only with a boundary, a proof and a failure meaning in the plan.
  integration-subset:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyflakes==4.0.0
      - name: Run the macOS integration subset
        run: |
          python3 -m pytest -q -m integration -rs \
            tests/integration/test_s6_session_hook_no_timeout.py \
            tests/integration/test_g_loopback_sync.py

  # macOS-only: exercise the installer/launchd path as far as an ephemeral, headless
  # runner allows. Branch protection requires no check, so a soft step here never blocks
  # merges. What it CANNOT prove (needs a real Mac): that `launchctl bootstrap gui/$UID`
  # actually loads under a login session, reboot persistence, and real Tailscale auth.
  macos-installer-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: dispatcher resolves through a symlink (readlink -f shim)
        run: |
          ln -s "$PWD/scripts/installer/dispatcher.sh" /tmp/hive-mind
          /tmp/hive-mind help | grep -q 'Subcommands'
      - name: launchd plists render + plutil -lint
        run: bash scripts/platform/macos/_launchd.sh --render-test
      - name: sync daemon answers on :9876 natively
        run: |
          HIVE_HOME="$PWD" python3 ./hv doctor rebuild >/dev/null 2>&1 || true
          HIVE_HOME="$PWD" nohup python3 hive_sync_daemon.py >/tmp/d.log 2>&1 &
          ok=
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9876/sync/hello >/dev/null && { ok=1; break; }
            sleep 1
          done
          [ -n "$ok" ] || { echo "daemon did not answer on :9876"; cat /tmp/d.log; exit 1; }
          echo "daemon answered /sync/hello"
      - name: launchctl bootstrap (best-effort; GUI domain may be absent in headless CI)
        continue-on-error: true
        run: |
          bash -c '. scripts/installer/_service.sh; service_install "$PWD" hive-sync'
          launchctl print "gui/$(id -u)/com.projectmentor.hive-sync" \
            || echo "gui domain unavailable in headless CI — bootstrap unverifiable here (needs a real Mac)"
      - name: service uninstall is idempotent
        run: bash -c '. scripts/installer/_service.sh; launchd_uninstall hive-sync; launchd_uninstall hive-sync'
