name: CLA Assistant
# Automated Contributor License Agreement gate.
# When someone opens a PR, the bot asks them to sign by commenting:
#   "I have read the CLA Document and I hereby sign the CLA"
# Signatures are recorded in the `cla-signatures` branch (signatures/version1/cla.json).
# This lets HiveMind stay AGPL while preserving the right to dual-license / enforce,
# because every contributor has granted the needed rights (see CLA.md).
#
# Setup notes:
#  - No extra secret is required for same-repo signature storage (uses GITHUB_TOKEN).
#  - To store signatures in a *separate* repo, add a PERSONAL_ACCESS_TOKEN secret.
#  - Add maintainer/bot logins to `allowlist` so they aren't prompted.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Why `pull_request_target`: the action must comment on, and set a status on, PRs from forks, and a plain
# `pull_request` run from a fork gets a read-only token and no secrets. This is safe only because the job
# NEVER checks out or runs PR-head code: there is no `actions/checkout` and no `run:` step, and the only
# step is the pinned action below, which reads the PR through the API. Keep it that way: adding a checkout
# of the PR head here would hand a write token to untrusted code.
# Least privilege: nothing by default, and the job asks for just what the action writes (the signatures
# branch, the PR comment, the commit status, and re-running the check after a signature).
permissions: {}

jobs:
  cla:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    # Dependabot (and other bots) get a restricted token, so the CLA action
    # cannot run on their PRs. Skip it for them; their changes are first-party.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recreate-signatures' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/projectmentor/hive-mind/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: david,projectmentor,dependabot[bot],hivemind-bot
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your contribution. Before it can be merged, please read our [Contributor License Agreement](https://github.com/projectmentor/hive-mind/blob/main/CLA.md) and sign it by posting the comment below.'
