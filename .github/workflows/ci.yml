name: CI
# Ubuntu legs, on every push to main and every pull request. The macOS legs live in ci-macos.yml, which
# runs on every push to main but on a pull request only when the diff can affect macOS (#125).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-26.04 is a canary for the ubuntu-latest -> Ubuntu 26.04 migration (Oct 19 - Nov 19, 2026;
        # actions/runner-images#14748). Remove it once ubuntu-latest is 26.04.
        os: [ubuntu-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist==3.8.0
      - name: Run offline test suite
        run: python3 -m pytest -q -n auto   # pytest-xdist: every core (the sign gate runs the same)

  # Android/Termux supervisor seam, exercised on an ordinary Linux runner (no phone,
  # no termux-services). `TERMUX_VERSION=1` forces the runit branch in _service.sh, so
  # we can validate kind detection + the rendered runit/Termux:Boot scripts without a
  # device. What it CANNOT prove (needs a real phone): that `sv`/runsvdir actually
  # supervise the daemon, Termux:Boot fires on reboot, and the app-owned Tailscale tun.
  android-installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]   # 26.04: migration canary, as in `test` above
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: runit run/boot scripts render + sh -n lint
        run: bash scripts/platform/termux/_runit.sh --render-test
      - name: _service_kind resolves to runit under a Termux environment
        run: TERMUX_VERSION=1 bash -c '. scripts/installer/_service.sh; [ "$(_service_kind)" = runit ] && type runit_install >/dev/null'
      - name: _service_kind stays systemd on an ordinary Linux runner (no regression)
        run: bash -c '. scripts/installer/_service.sh; [ "$(_service_kind)" = systemd ]'
      - name: runit_uninstall is idempotent
        run: TERMUX_VERSION=1 bash -c '. scripts/installer/_service.sh; runit_uninstall hive-sync; runit_uninstall hive-sync'
      - name: installer scripts lint clean (bash -n)
        run: |
          for f in install.sh _install_node.sh _service.sh _invite.sh _uninstall.sh _update.sh _reset.sh _status.sh dispatcher.sh; do
            bash -n "scripts/installer/$f"
          done
          bash scripts/installer/_reset.sh --help | grep -q 'reset'      # reset usage works
          bash scripts/installer/dispatcher.sh help | grep -q 'reset'    # dispatcher routes it
          # Per-OS service backends now live under scripts/platform/<os>/ (see scripts/README.md).
          for f in scripts/platform/linux/_units.sh scripts/platform/macos/_launchd.sh scripts/platform/termux/_runit.sh; do
            bash -n "$f"
          done
      - name: hive-mind invite runs + dispatcher routes it
        run: |
          bash scripts/installer/_invite.sh >/dev/null          # exits 0 even with no tailscale (warns)
          bash scripts/installer/dispatcher.sh help | grep -q 'invite'
      - name: seed-address parser strips scheme/user/path, rejects junk
        run: |
          python3 - <<'PY'
          import re
          def parse(s):
              s=s.strip(); s=re.sub(r'^[a-zA-Z][a-zA-Z0-9+.-]*://','',s)
              if '@' in s: s=s.split('@',1)[1]
              s=s.split('/',1)[0]; host,port=s,'9876'
              if ':' in s: host,port=s.rsplit(':',1)
              host=host.strip(); port=(port.strip() or '9876')
              return f'{host} {port}' if host and re.match(r'^[A-Za-z0-9._-]+$',host) and port.isdigit() else ''
          assert parse('100.84.84.100')=='100.84.84.100 9876'
          assert parse('david@100.84.84.100:9876')=='100.84.84.100 9876'
          assert parse('http://100.84.84.100:9876/sync')=='100.84.84.100 9876'
          assert parse('garbage here')==''
          assert parse('')==''
          print('seed-parse OK')
          PY
